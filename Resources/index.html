<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discipline</title>
  <style>
    :root {
      color-scheme: dark;
      --idle: #aab2bf;
      --running: #69b7ff;
      --needs: #f5c451;
      --ready: #63d99b;
      --blocked: #ff6b6b;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    .pet {
      position: relative;
      width: 112px;
      height: 112px;
    }

    .backplate,
    .halo,
    .ring,
    .waiting-mark {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .backplate circle {
      fill: rgba(10, 12, 16, 0.88);
      stroke: rgba(255, 255, 255, 0.045);
      stroke-width: 1;
    }

    .ring circle {
      fill: none;
      stroke: rgba(228, 235, 245, 0.84);
      stroke-width: 8.5;
      transform-origin: 120px 120px;
    }

    .halo circle {
      fill: none;
      stroke-width: 7;
      opacity: 0;
      transform-origin: 120px 120px;
    }

    .inner-motion,
    .blocked-layer {
      position: absolute;
      inset: 3px;
      width: 106px;
      height: 106px;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      /* 编织图案在 220px 源图内偏左上（完整图案中心 107,104 vs 图中心 109.5,109.5），
         按公共中心整体右移 +2.5px、下移 +5.5px 源像素，折算到 106px 显示层：1.2px / 2.65px */
      transform: translate(1.2px, 2.65px);
    }

    .inner-motion {
      image-rendering: auto;
    }

    .running-layer { filter: drop-shadow(0 0 7px rgba(105, 183, 255, 0.34)); }
    .ready-layer { filter: drop-shadow(0 0 7px rgba(99, 217, 155, 0.34)); }
    .needs-layer { filter: drop-shadow(0 0 7px rgba(245, 196, 81, 0.34)); }
    .blocked-layer { filter: drop-shadow(0 0 7px rgba(255, 107, 107, 0.34)); }

    .pet[data-state="running"] .running-layer,
    .pet[data-state="ready"] .ready-layer,
    .pet[data-state="needs"] .needs-layer,
    .pet[data-state="blocked"] .blocked-layer {
      opacity: 1;
      visibility: visible;
    }

    .blocked-slice {
      position: absolute;
      inset: 0;
      background: url("blocked.png") center / 100% 100% no-repeat;
    }

    .blocked-slice:nth-child(1) {
      clip-path: polygon(0 0, 100% 0, 100% 29%, 0 34%);
      transform: translate(-2px, 1px);
    }

    .blocked-slice:nth-child(2) {
      clip-path: polygon(0 32%, 100% 27%, 100% 54%, 0 60%);
      transform: translate(2px, -1px);
    }

    .blocked-slice:nth-child(3) {
      clip-path: polygon(0 58%, 100% 52%, 100% 76%, 0 81%);
      transform: translate(-3px, 2px);
    }

    .blocked-slice:nth-child(4) {
      clip-path: polygon(0 79%, 100% 74%, 100% 100%, 0 100%);
      transform: translate(2px, -2px);
    }

    .waiting-mark {
      opacity: 0;
      visibility: hidden;
    }

    .pet[data-state="needs"] .waiting-mark {
      opacity: 1;
      visibility: visible;
    }

    .waiting-mark path {
      fill: none;
      stroke: var(--needs);
      stroke-width: 6.5;
      stroke-linecap: round;
    }

    .waiting-mark circle {
      fill: var(--needs);
      transform-origin: 124px 51px;
      animation: tip-pulse 1s ease-in-out infinite;
    }

    .pet[data-state="idle"] .ring circle {
      animation: idle-breathe 3.8s ease-in-out infinite;
    }

    .pet[data-state="blocked"] {
      animation: blocked-flicker 3.2s ease-in-out infinite;
    }

    @keyframes idle-breathe {
      0%, 100% { opacity: .72; transform: scale(.99); }
      50% { opacity: 1; transform: scale(1.012); }
    }

    @keyframes tip-pulse {
      0%, 100% { opacity: .35; transform: scale(.72); }
      50% { opacity: 1; transform: scale(1.35); }
    }

    @keyframes blocked-flicker {
      0%, 91%, 100% { opacity: 1; }
      94% { opacity: .48; }
      97% { opacity: .82; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="pet" data-state="idle" role="img" aria-label="Discipline: Idle">
    <svg class="backplate" viewBox="0 0 240 240" aria-hidden="true">
      <circle cx="120" cy="120" r="103"></circle>
    </svg>

    <img class="inner-motion running-layer" alt="">
    <img class="inner-motion ready-layer" alt="" src="ready.png">
    <img class="inner-motion needs-layer" alt="" src="needs.png">

    <div class="blocked-layer" aria-hidden="true">
      <span class="blocked-slice"></span>
      <span class="blocked-slice"></span>
      <span class="blocked-slice"></span>
      <span class="blocked-slice"></span>
    </div>

    <svg class="waiting-mark" viewBox="0 0 240 240" aria-hidden="true">
      <path d="M109 61 C115 58 119 54 122 52"></path>
      <circle cx="124" cy="51" r="3.4"></circle>
    </svg>

    <svg class="halo" viewBox="0 0 240 240" aria-hidden="true">
      <circle cx="120" cy="120" r="103"></circle>
    </svg>

    <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
      <circle cx="120" cy="120" r="103"></circle>
    </svg>
  </div>

  <script>
    (() => {
      const allowedStates = new Set(['idle', 'running', 'needs', 'ready', 'blocked']);
      const colors = {
        needs: '#f5c451',
        ready: '#63d99b',
        blocked: '#ff6b6b'
      };
      const pet = document.querySelector('.pet');
      const running = document.querySelector('.running-layer');
      const halo = document.querySelector('.halo circle');
      let state = 'idle';
      let timers = [];
      let lastFrame = performance.now();

      function clearMotion() {
        timers.forEach(timer => clearTimeout(timer));
        timers = [];
        pet.getAnimations().forEach(animation => animation.cancel());
        halo.getAnimations().forEach(animation => animation.cancel());
        halo.style.opacity = '0';
      }

      function pulse(color, repeats) {
        halo.style.stroke = color;
        halo.animate([
          { opacity: 0, transform: 'scale(.985)' },
          { opacity: .86, transform: 'scale(1.012)', offset: .3 },
          { opacity: 0, transform: 'scale(1.09)' }
        ], {
          duration: 620,
          iterations: repeats,
          easing: 'cubic-bezier(.2,.76,.2,1)'
        });
      }

      function restartRunning() {
        running.removeAttribute('src');
        requestAnimationFrame(() => {
          running.src = 'running.png';
        });
      }

      function setState(next) {
        if (!allowedStates.has(next) || state === next) return;
        state = next;
        clearMotion();
        pet.dataset.state = state;
        pet.setAttribute('aria-label', `Discipline: ${state}`);

        if (state === 'running') restartRunning();
        if (state === 'ready') timers.push(setTimeout(() => pulse(colors.ready, 2), 120));
        if (state === 'needs') timers.push(setTimeout(() => pulse(colors.needs, 1), 80));
        if (state === 'blocked') {
          pet.animate([
            { transform: 'translateX(0)' },
            { transform: 'translateX(-3px)', offset: .2 },
            { transform: 'translateX(3px)', offset: .43 },
            { transform: 'translateX(-2px)', offset: .66 },
            { transform: 'translateX(0)' }
          ], { duration: 190, easing: 'linear' });
          timers.push(setTimeout(() => pulse(colors.blocked, 1), 60));
        }
      }

      function frame(now) {
        lastFrame = now;
        requestAnimationFrame(frame);
      }

      window.Discipline = {
        setState,
        getState: () => state,
        lastFrameAt: () => lastFrame
      };

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
